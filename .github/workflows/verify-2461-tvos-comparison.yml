name: "Swiftfin #2461 paired tvOS runtime comparison"
on:
  push:
    branches: [verification/2461-official-xcode]
    paths:
      - .github/workflows/verify-2461-tvos-comparison.yml
      - .github/verification/2461/comparison-*
permissions:
  contents: read
concurrency:
  group: verify-2461-comparison-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'montelR/Swiftfin' && github.event.repository.private == false && github.ref == 'refs/heads/verification/2461-official-xcode'
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: upstream
            commit: 35a5f35812deb9838dfc69b6554a6a3f935797d1
          - variant: revision-e
            commit: 12b3c2b4684ced6b412adf865ca793685e331465
    name: Runtime comparison (${{ matrix.variant }})
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and evaluate isolated reference
        run: bash .github/verification/2461/comparison-run.sh '${{ matrix.variant }}' '${{ matrix.commit }}'
      - name: Retain all comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comparison-2461-${{ matrix.variant }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
